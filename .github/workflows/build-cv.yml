name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "fr/**.tex"
      - "en/**.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ghostscript
        run: sudo apt-get update -q && sudo apt-get install -qy ghostscript

      - name: Build LaTeX image
        run: docker build -t jankapunkt/latexcv:1.0 .

      - name: Build CVs
        run: |
          ./build.sh fr
          ./build.sh en

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fr/heuzef_cv.pdf fr/heuzef_cv.min.pdf en/heuzef_cv.pdf en/heuzef_cv.min.pdf
          git diff --staged --quiet || git commit -m "✨📄 Mise à jour automatique du CV (FR/EN)" -m "Généré le $(date +'%d/%m/%Y à %Hh%M') par GitHub Actions 🤖"
          git push
